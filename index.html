<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffdde1;
            overflow: hidden;
        }

        img {
            width: 300px;
            margin-top: 50px;
        }

        h1 {
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            position: absolute;
            border: none;
            border-radius: 10px;
        }

        #yesBtn {
            left: 40%;
            top: 65%;
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            left: 55%;
            top: 65%;
            background-color: #444;
            color: white;
        }
    </style>
</head>
<body>

    <!-- FIRST GIF -->
    <img src="gifs/minion-minion-loves.gif">

    <h1>Mrs Khloe Brownstains, Will you be my Valentine? 💖</h1>

    <!-- YES goes to another page -->
    <button id="yesBtn" onclick="window.location.href='yay.html'">Yes 💕</button>

    <!-- NO moves -->
    <button id="noBtn">No 💔</button>

    <script>
        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("mouseover", function () {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        });
    </script>

</body>
</html>
